services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: local_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "./qdrant",
          "healthcheck",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.9.0
    container_name: local_grobid
    ports:
      - "8070:8070"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/api/isalive', timeout=5).read()\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local_rag_api
    depends_on:
      qdrant:
        condition: service_healthy
      grobid:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./corpus:/app/corpus
      - ./index_storage:/app/index_storage
      - ./scripts:/app/scripts
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_CHAT_MODEL: qwen3.6:35b
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: academic_corpus
      GROBID_URL: http://grobid:8070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  qdrant_storage:
